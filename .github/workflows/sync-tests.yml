name: Selective synchronization tests
on:
  push:
    branches: [main]
    paths:
      - 'system/**'
      - 'scripts/**'
      - 'tests/**'
      - 'configs/task_il_joint/**'
      - 'configs/sync/**'
      - 'run_all_sync.sh'
      - 'run_all_task_il*.sh'
      - '.github/workflows/sync-tests.yml'
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python -m compileall -q system scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_job_ledger.py
      - run: python scripts/run_campaign.py --estimate-only
      - run: python scripts/run_campaign.py --dry-run --setting S14 --seed 42 --budget 3
      - run: python scripts/build_task_il_ledger.py
      - run: python scripts/run_campaign.py --ledger experiments/task_il_core/job_ledger.jsonl --dry-run
      - run: python scripts/build_job_ledger.py --suite extended
      - run: python scripts/build_task_il_ledger.py --suite extended
      - run: python -m unittest discover -s tests -p test_core_ledgers.py -v
      - run: bash run_all_task_il_joint.sh --dry-run
      - run: bash run_all_task_il_joint.sh --estimate-only
  real-data-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scipy
      - run: python scripts/build_job_ledger.py
      - run: python scripts/run_campaign.py --stage data --setting S14 --seed 42 --device cpu --resume
      - run: python scripts/preflight_sync.py --setting S14 --seed 42 --output preflight_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cifar100-preflight-summary
          path: |
            preflight_summary.json
            experiments/logs/*.log
            experiments/job_ledger.status.json
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scikit-learn scipy
      - run: FEDQCL_TRAINING_TEST=1 python -m unittest discover -s tests -p test_sync_training.py -v
      - run: TASK_IL_TRAINING_TEST=1 python -m unittest discover -s tests -p test_task_il.py -v
      - run: TASK_IL_TRAINING_TEST=1 python -m unittest discover -s tests -p test_task_il_joint.py -v
