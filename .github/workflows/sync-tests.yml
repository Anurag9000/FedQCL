name: Selective synchronization unit tests
on:
  push:
    branches: [main]
    paths:
      - 'system/flcore/sync/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-tests.yml'
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q system scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_job_ledger.py
      - run: python scripts/run_campaign.py --stage pilot --dry-run
