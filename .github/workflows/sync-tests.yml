name: Selective synchronization tests
on:
  push:
    branches: [main]
    paths:
      - 'system/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-tests.yml'
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q system scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_job_ledger.py
      - run: python scripts/run_campaign.py --stage pilot --dry-run
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scikit-learn scipy
      - run: FEDQCL_TRAINING_TEST=1 python -m unittest discover -s tests -p test_sync_training.py -v
